# Every word on the site lives in this file. Edit the prose, rebuild, push:
#
#   .venv/bin/python -m pipeline.build_site
#   git commit -am "Site copy edits" && git push
#
# Two rules.
#
# 1. Anything in curly braces is a live value the generator fills in, like
#    {people_count} or {scholar_date}. Keep the spelling exactly; a name the
#    page does not provide stops the build with a message naming the key and
#    listing what is available. Each section below says which values it has.
#    To write a literal brace, double it: {{ }}
#
# 2. HTML is allowed and is how links are written:
#    <a href="...">text</a>, <strong>bold</strong>, <em>italic</em>.
#    Leave the class="..." attributes alone; they carry the styling.
#
# Long strings are wrapped in triple quotes. Line breaks inside them are
# cosmetic: the browser reflows the text, so wrap wherever it reads well.

[site]
# Header, footer and other chrome. Values: contact, repo, methods_href
wordmark_lead = "Planning"
wordmark_rest = "Citation Metrics"
beta_tag = "Beta"
search_placeholder = "Search faculty or schools"
nav_rankings = "Rankings"
nav_departments = "Departments"
nav_methods = "Methods"
title_suffix = "Planning Citation Metrics"
footer_about = """Citation metrics for urban planning faculty in the United States and Canada, continuing the
       dataset Tom Sanchez maintained from 2017 to 2026.
       <a href="{methods_href}">How these numbers are produced</a> &middot;
       <a href="{repo}">Source and data on GitHub</a>"""
footer_corrections = """Counts come from public profile pages and change constantly; treat them as approximate.
       This site is in beta. Spotted something wrong, or want your entry changed or removed?
       Email <a href="mailto:{contact}?subject=Planning%20Citation%20Metrics">{contact}</a>
       or <a href="{repo}/issues/new">open an issue</a>."""

