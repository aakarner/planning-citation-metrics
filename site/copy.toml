[methods]
meta_description = "Sources, update cadence, inclusion criteria, and known limitations."
# Values: people_count, scholar_count, fallback_count, scholar_date, openalex_date,
#         scholar_help, repo, db_href, year, contact
eyebrow = "Methods"
heading = "Where these numbers come from"
lede = """This project continues a dataset Tom Sanchez maintained by hand from 2017 to 2026.
     It is now collected on a schedule, stored as a running record, and published from a public
     repository."""
sources_heading = "Sources, in order of preference"
sources_scholar = """<strong>Google Scholar</strong> is the headline source. It counts books, reports and other
     non-journal work that matters in planning, and it is what the field is used to seeing. Of the
     {people_count} faculty here, {scholar_count} have a Scholar profile.
     Last refreshed {scholar_date}."""
sources_openalex = """<strong>OpenAlex</strong> covers the remaining {fallback_count} people, who have no Scholar profile we
     could find. Those figures are marked <span class="pill pill-oa">OpenAlex</span> everywhere they
     appear. OpenAlex is journal-centric and normally reports fewer citations than Scholar for the
     same person, so those numbers are very likely undercounts and are not comparable to the Scholar
     ones. We do not adjust or scale them; we label them.
     Last refreshed {openalex_date}."""
sources_invitation = """Anyone shown with an OpenAlex figure can move to the Scholar series by
     <a href="{scholar_help}">creating a Scholar profile</a>. We re-check for new profiles each
     semester."""
cadence_heading = "How often it updates"
cadence_body = """OpenAlex monthly, Google Scholar quarterly, faculty rosters twice a year. Every run is
     appended, never overwritten, so the history builds up from the first snapshot in
     February and March 2026 rather than being reconstructed backwards."""
inclusion_heading = "Who is included"
inclusion_body = """Regular full-time tenured and tenure-track faculty at planning programs in the United States
     and Canada: the population Tom tracked. Adjunct, visiting and clinical appointments are out.
     The school list began as the membership of the Association of Collegiate Schools of Planning
     and has a handful of programs added on request, mostly Canadian. Each program page says which
     it is."""
percentiles_heading = "Percentiles and per-year figures"
percentiles_body = """Percentiles are computed across the faculty in this dataset, both overall and within academic
     rank, so a percentile means "relative to the people on this site", not to all of academia.
     Citations per year divides total citations by years since the PhD, which flatters nobody
     consistently: it favours people whose early work was widely cited and penalises anyone whose
     PhD year we have wrong."""
limitations_heading = "Known ways this is wrong"
limitation_lag = """<strong>Profiles lag reality.</strong> Appointments are updated from what a Scholar profile
        says, so someone who moved but has not updated their profile stays put here."""
limitation_names = """<strong>Name collisions.</strong> A common name can pick up another researcher's record,
        particularly on the OpenAlex side. Matches were reviewed, but not all of them."""
limitation_scholar = """<strong>Scholar counts are generous.</strong> They include citations from preprints, theses
        and self-citations, and they change from week to week."""
limitation_missing = """<strong>Missing people.</strong> New hires appear only after the next roster review, and
        anyone recorded as having left a tracked program drops out of the site entirely, so a
        search for them returns nothing even though their earlier figures remain in the
        downloadable data."""
corrections_body = """The site is in beta, so expect all of the above to be more common now than it will be
     later. Corrections are welcome and quick to apply: email Alex Karner at
     <a href="mailto:{contact}?subject=Planning%20Citation%20Metrics%20correction">{contact}</a>,
     or <a href="{repo}/issues/new">open an issue</a>. If you would rather not have an individual
     page here at all, say so and it will be removed."""
data_heading = "Get the data"
data_body = """Everything is public. The curated roster and every dated snapshot live as CSV in the
     <a href="{repo}/tree/main/data">repository</a>; the built database, with the percentile and
     summary views already defined, is one file:"""
data_links = """<a href="{db_href}"><strong>citations.sqlite</strong></a> &middot;
     <a href="{repo}">pipeline source</a>"""
citation_body = """Please cite it as: Karner, A. and T. W. Sanchez ({year}).
     <em>Planning Citation Metrics</em>. {repo}"""
