[project]
name = "planning-citation-metrics"
version = "0.1.0"
description = "Citation metrics for urban planning faculty: pipeline, database, and site data."
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
scholar = [
    "scholarly>=1.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
