name: Collect Google Scholar metrics (weekly, rolling)

# Up to fifty SerpApi searches every Monday, sized for the free tier (250 a
# month, 50 an hour; paced at 75 s so an hour never sees more than 48 calls).
# Fifty on each of five Mondays is the whole tier, so the run first asks the
# account what it has left and cuts itself to that: a short month ends in a
# smaller run, not a failed one.
#
# First, profile discovery: up to about a dozen searches looking for profiles
# of people who have none on file. People whose id died go first, then people
# never searched, then people searched more than six months ago with nothing
# found. Then the rolling re-read spends what discovery left, oldest reading
# first, so every current profile is re-read every four to five months.
#
# The run ends by writing the change report (who looks to have moved, whose
# profile may be a namesake's, whose rank is due a look) and keeping it as the
# `change-report` artifact; the health check raises the serious part of it as
# an issue.
#
# Needs the SERPAPI_KEY repository secret; the job skips itself with an
# explanation if the secret is absent rather than failing.
on:
  schedule:
    - cron: "23 6 * * 1"            # 06:23 UTC every Monday
  workflow_dispatch:
    inputs:
      budget:
        description: "SerpApi searches to spend this run, discovery and re-read together"
        required: false
        default: "50"
      discovery:
        description: "Of those, how many discovery may spend"
        required: false
        default: "12"

permissions:
  contents: write

# A run started by hand while the scheduled one is going would spend the same
# searches twice and race it to the push; it waits its turn instead.
concurrency:
  group: collect-scholar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check the key is present
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "::warning::SERPAPI_KEY is not set, so there is nothing to collect with."
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - name: Size the run to the searches the account has left
        if: env.skip != 'yes'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ASKED: ${{ github.event.inputs.budget || '50' }}
          ASKED_DISCOVERY: ${{ github.event.inputs.discovery || '12' }}
        run: |
          # The rule is pipeline.collect_scholar.weekly_plan; the balance lookup is free.
          python - >> "$GITHUB_ENV" <<'PY'
          import os
          from pipeline.collect_scholar import searches_left, weekly_plan
          left = searches_left(os.environ["SERPAPI_KEY"])
          total, discovery = weekly_plan(int(os.environ["ASKED"]), int(os.environ["ASKED_DISCOVERY"]), left)
          print(f"TOTAL={total}\nDISCOVERY={discovery}\nLEFT={'unknown' if left is None else left}")
          PY
          total="$(grep '^TOTAL=' "$GITHUB_ENV" | tail -1 | cut -d= -f2)"
          echo "searches left: $(grep '^LEFT=' "$GITHUB_ENV" | tail -1 | cut -d= -f2); this run may spend $total"
          if [ "$total" -lt "$ASKED" ]; then
            echo "::warning::SerpApi has $total searches left, so this run spends $total, not $ASKED."
          fi
      - name: Look for profiles of people who have none
        if: env.skip != 'yes'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ "$TOTAL" -eq 0 ]; then
            # Nothing to search with. Say so in the record, so the health check reports people waiting.
            python -m pipeline.discovery_status --state data/review/discovery_status.json --failed
            spent=0
          elif [ "$DISCOVERY" -eq 0 ]; then
            echo "too few searches left for discovery this week; the re-read gets them all"
            python -m pipeline.discovery_status --state data/review/discovery_status.json --skipped
            spent=0
          else
            # A discovery that crashes must not cost the week's readings: record it and go on.
            python -m pipeline.find_scholar_profiles --via serpapi --sleep 75 --max-searches "$DISCOVERY" \
                --report "$RUNNER_TEMP/discovery.json" --status data/review/discovery_status.json \
              || { echo "::warning::profile discovery failed; see the log above"
                   python -m pipeline.discovery_status --state data/review/discovery_status.json --failed; }
            spent="$(python -c 'import json, sys; print(json.load(open(sys.argv[1]))["searches"])' "$RUNNER_TEMP/discovery.json" 2>/dev/null || echo "$DISCOVERY")"
          fi
          reread=$(( TOTAL - spent )); [ "$reread" -lt 1 ] && reread=1
          echo "discovery spent $spent searches; the re-read gets $reread"
          echo "reread=$reread" >> "$GITHUB_ENV"
      - name: Re-read the oldest profiles
        if: env.skip != 'yes'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          # A profile discovery just accepted has no reading yet, so it comes first here.
          # The collector cuts its own budget to what the account has left (and fails, having
          # asked for nothing, when that is zero), stops at once if the account runs dry
          # part-way, and gives up after half an hour of refusals: well inside the time limit.
          python -m pipeline.collect_scholar --via serpapi --sleep 75 --jitter 10 --max-wait 0.5 --budget "$reread"
      # The remaining steps run even when the re-read failed or the job was cancelled at
      # its time limit: what discovery found and what was read before the stop is kept.
      # (On 2026-11-16 a cancelled run threw away an accepted profile and eight readings.)
      - name: Apply roster changes the profiles imply
        if: always() && env.skip != 'yes'
        run: python -m pipeline.apply_changes
      - name: Rebuild and report what is left unsettled
        if: always() && env.skip != 'yes'
        run: |
          python -m pipeline.build_db
          mkdir -p "$RUNNER_TEMP/change-report"
          # The report is for a person to read; if it cannot be written, the readings are still saved and published.
          if python -m pipeline.detect_changes --out "$RUNNER_TEMP/change-report/change_report.md" > /dev/null; then
            # The run page gets the count; the names stay in the artifact.
            { echo "### Change report"; echo; sed -n '3p' "$RUNNER_TEMP/change-report/change_report.md"; echo
              echo "The full report and the rank review sheet are in this run's \`change-report\` artifact."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the change report could not be written; see the log above"
          fi
      - name: Keep the change report
        if: always() && env.skip != 'yes'
        uses: actions/upload-artifact@v7
        # For a person to read, not part of the collection; a storage hiccup must not fail the run.
        continue-on-error: true
        with:
          name: change-report
          path: ${{ runner.temp }}/change-report
          retention-days: 90
      - name: Commit
        if: always() && env.skip != 'yes'
        run: |
          git add data/snapshots/google_scholar data/roster data/review/identity_candidates.csv data/review/discovery_status.json
          bash .github/scripts/commit_and_push.sh "Google Scholar rolling snapshot $(date -u +%Y-%m-%d)"

  deploy:
    needs: collect
    if: needs.collect.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  # Runs whether or not the collection succeeded: a run that failed, came up
  # short or never started is exactly what this is here to report.
  health:
    needs: collect
    if: always()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/health-check.yml
    with:
      expect: scholar
      job_result: ${{ needs.collect.result }}
    secrets:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
