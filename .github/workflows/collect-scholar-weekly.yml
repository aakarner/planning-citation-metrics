name: Collect Google Scholar metrics (weekly, rolling)

# About fifty profiles a week, oldest reading first, so every current profile
# is re-read roughly every fifteen weeks. Sized for SerpApi's free tier (250
# searches a month, 50 an hour): paced at 75 s so an hour never sees more than
# 48 calls. Needs the SERPAPI_KEY repository secret; the job skips itself with
# an explanation if the secret is absent rather than failing.
on:
  schedule:
    - cron: "23 6 * * 1"            # 06:23 UTC every Monday
  workflow_dispatch:
    inputs:
      budget:
        description: "Profiles to re-read this run"
        required: false
        default: "50"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Check the key is present
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          if [ -z "$SERPAPI_KEY" ]; then
            echo "::warning::SERPAPI_KEY is not set, so there is nothing to collect with."
            echo "skip=yes" >> "$GITHUB_ENV"
          fi
      - name: Re-read the oldest profiles
        if: env.skip != 'yes'
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          python -m pipeline.collect_scholar --via serpapi --sleep 75 --jitter 10 \
            --budget "${{ github.event.inputs.budget || '50' }}"
      - name: Apply roster changes the profiles imply
        if: env.skip != 'yes'
        run: python -m pipeline.apply_changes
      - name: Rebuild and report what is left unsettled
        if: env.skip != 'yes'
        run: |
          python -m pipeline.build_db
          python -m pipeline.detect_changes
      - name: Commit
        if: env.skip != 'yes'
        run: |
          git config user.name "citation-metrics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots/google_scholar data/roster
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Google Scholar rolling snapshot $(date -u +%Y-%m-%d)"
          git push
