name: Collect OpenAlex metrics

on:
  schedule:
    - cron: "17 6 1 * *"        # 06:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fetch one record per matched person (free by-id lookups)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}   # optional; raises the anonymous limit
        run: python -m pipeline.collect_openalex
      - name: Rebuild database as a sanity check
        run: python -m pipeline.build_db
      - name: Commit the snapshot
        run: |
          git config user.name "citation-metrics-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots/openalex
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "OpenAlex snapshot $(date -u +%Y-%m-%d)"
          git push
