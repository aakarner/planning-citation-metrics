name: Collect OpenAlex metrics

on:
  schedule:
    - cron: "17 6 1 * *"        # 06:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-openalex
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90           # a full run takes about twenty; without a limit a hung request holds the runner for six hours
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fetch one record per matched person (free by-id lookups)
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}   # needed: the works-index checks are metered, and the anonymous budget ran out at 706 of 1,050 people on 2026-11-01
        run: python -m pipeline.collect_openalex
      - name: Rebuild database
        run: python -m pipeline.build_db
      - name: Drop matches the new numbers contradict
        run: python -m pipeline.audit_matches
      - name: Rebuild after the audit
        run: python -m pipeline.build_db
      - name: Fill PhD year and institution from ORCID where blank
        run: python -m pipeline.fill_phd_from_orcid
      # Runs even when a step above failed or the job hit its time limit: the snapshot is
      # resumable (a second run the same day fetches only the people missed), so what was
      # collected is worth keeping, and the failed job is still reported as failed.
      - name: Commit the snapshot
        if: always()
        run: |
          git add data/snapshots/openalex data/roster/person.csv data/review/identity_candidates.csv
          bash .github/scripts/commit_and_push.sh "OpenAlex snapshot $(date -u +%Y-%m-%d)"

  deploy:
    needs: collect
    if: needs.collect.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  # Runs whether or not the collection succeeded: a run that failed, came up
  # short or never started is exactly what this is here to report.
  health:
    needs: collect
    if: always()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/health-check.yml
    with:
      expect: openalex
      job_result: ${{ needs.collect.result }}
    secrets:
      SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
