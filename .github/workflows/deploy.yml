name: Deploy site

on:
  push:
    branches: [main]
    # site/** carries copy.toml, which is the whole point of editing copy; leaving
    # it out meant a copy edit pushed but never published.
    paths: ["data/**", "sql/**", "pipeline/**", "site/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  # Called by the collector workflows after they commit: a push made with the
  # workflow token does not trigger other workflows, so the weekly Scholar run
  # on 2026-10-12 committed 47 readings and the site never rebuilt.
  workflow_call:

# One deploy at a time; a newer push supersedes a queued one but never
# interrupts a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # the branch tip, not the commit a calling run started on
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Build database
        run: python -m pipeline.build_db
      - name: Build site
        run: python -m pipeline.build_site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
      - id: deployment
        uses: actions/deploy-pages@v4
